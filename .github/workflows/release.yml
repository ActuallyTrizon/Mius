name: Release CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      publish_after_build:
        description: 'Do you want to run publish.yml after?'
        required: true
        type: boolean
        default: false
      tag_name:
        description: 'Release Tag (Required)'
        required: false
        type: string

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          
      - name: Grant Permission
        run: chmod +x gradlew

      - name: Build Unsigned APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        id: sign_app
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.SIGN_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASS }}
          keyPassword: ${{ secrets.KEY_PASS }}

      - name: Rename Signed APK
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | cut -d'"' -f2)
          mkdir -p dist
          SIGNED_FILE="${{ steps.sign_app.outputs.signedFile }}"
          
          cp "$SIGNED_FILE" "dist/Todoro-$VERSION_NAME-release.apk"
          echo "Successfully packaged dist/Todoro-$VERSION_NAME-release.apk"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v7
        with:
          name: Release
          path: dist/*.apk

  trigger-publish:
    name: Trigger Publish Workflow
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_after_build == 'true'
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate Tag Name
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            echo "Error: Tag name is required when publishing is enabled."
            exit 1
          fi
          echo "Tag name is valid: $TAG"

      - name: Trigger Publish
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          echo "Triggering publish.yml for release with tag $TAG..."
          gh workflow run publish.yml \
            -f workflow_type=release \
            -f tag_name="$TAG"